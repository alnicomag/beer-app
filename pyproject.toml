[project]
name = "can-label-lab"
version = "0.1.0"
description = "Experimental tools for reconstructing flattened can-label images."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "jinja2",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pyyaml",
    "scikit-image",
    "scipy",
    "typer",
]

[project.scripts]
canlabel = "canlabel.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canlabel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
